name: Karasu
version: 1.0.0
main: codes.castled.karasu.KarasuPlugin
# Minimum supported server version, not the version this was built against. Paper rejects a plugin
# declaring an api-version newer than the server, so 26.3 here would make the jar unloadable on any
# older server. Every API this plugin uses exists as far back as 1.21.9.
api-version: '1.21'
description: Crow transformation plugin with BetterModel and ModelEngine support
author: castled
# BetterModel is listed first because it is the engine that supports 26.3; ModelEngine is kept as a
# fallback for 26.2 servers. Both are optional - karasu.visual.model-engine picks between them.
softdepend: [BetterModel, ModelEngine, UnlimitedNameTags, packetevents]

commands:
  karasu:
    description: Karasu - crow transformation, crow spawning, and admin
    usage: /karasu <morph|info|spawn [count]|debug|reload>
    aliases: [kcrows, crow]
    permission: karasu.crows

permissions:
  karasu.crows:
    description: Allows use of /karasu morph, info and spawn
    default: op
  karasu.exempt:
    description: Players with this are not affected by the teleport/spectator crow effect
    default: false
  karasu.reload:
    description: Allows use of /karasu reload
    default: op
  karasu.crow.spawn:
    description: Allows use of /karasu spawn [count]
    default: op